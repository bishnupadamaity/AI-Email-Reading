# Local development infrastructure only. Credentials come from .env (or the
# defaults below) and are intentionally non-production values.
name: email-ai-platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: email-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-email_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email_ai_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-email_ai}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-email_ai} -d ${POSTGRES_DB:-email_ai}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: email-ai-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
